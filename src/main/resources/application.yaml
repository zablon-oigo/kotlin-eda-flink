ktor:
  deployment:
    port: 8080
  application:
    modules:
      - org.example.RoutingKt.configureRouting

kafka:
  bootstrapServers: "localhost:29092"
  schemaRegistryUrl: "http://localhost:8081"
  topic: "flights"
  clientId: "flight-data-generator"
  acks: "all"
  retries: 3
  batchSize: 16384
  lingerMs: 1
  bufferMemory: 33554432